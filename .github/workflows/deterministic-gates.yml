name: deterministic-gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deterministic-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-checks:
    name: base-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run deterministic checks
        run: ./scripts/check.sh

      - name: Run red-team regression tests
        run: ./scripts/test-checks.sh

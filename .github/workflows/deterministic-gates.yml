name: deterministic-gates

on:
  pull_request:
  pull_request_review:
    types:
      - submitted
      - dismissed
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deterministic-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-checks:
    name: base-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run deterministic checks
        run: ./scripts/check.sh

      - name: Run red-team regression tests
        run: ./scripts/test-checks.sh

  human-approval-only:
    if: >-
      github.event_name == 'pull_request_review' &&
      (github.event.action == 'dismissed' ||
      github.event.review.state == 'approved')
    name: human-approval-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require an effective human approval and reject Bot or App approvals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/human_approval_only.py
          --repository "${{ github.repository }}"
          --pull-number "${{ github.event.pull_request.number }}"

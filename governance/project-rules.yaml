{
  "schema_version": "V3.2.1-C5-RULES-R1",
  "layer": "project",
  "policy_id": "v3-multi-agent-sandbox-project",
  "repository": "gg810612-pixel/v3-multi-agent-sandbox",
  "inherits": "governance/global-rules.yaml",
  "rules": {
    "deny": [
      "agent-no-merge",
      "agent-no-approve",
      "reviewer-advisory-only",
      "agent-no-governance-mutation",
      "agent-no-human-credential-access",
      "automatic-planned-provider-enablement",
      "parallel-writers-on-one-branch"
    ],
    "required": [
      "github-implementation-truth",
      "human-only-approval",
      "authoritative-github-identity",
      "single-writer-branch",
      "untrusted-intake",
      "base-pinned-verifier",
      "fail-closed",
      "base-checks",
      "human-approval-only",
      "provenance-device",
      "credential-boundary",
      "controlled-pilot",
      "c5-runtime-before-production-activation"
    ],
    "allow": [
      "read-assigned-repository",
      "write-assigned-branch",
      "create-commit",
      "push-assigned-branch",
      "open-pull-request",
      "comment-pull-request"
    ]
  }
}
